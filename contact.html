<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yhteys | Nova Ride</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">Nova Ride</a>
        <nav class="main-nav" aria-label="Päävalikko">
          <a href="catalog.html">Autot</a>
          <a href="tuning.html">Tuning</a>
          <a href="solar.html">Energia</a>
          <a href="contact.html">Yhteys</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-hero small-hero">
        <div class="container">
          <p class="eyebrow">Yhteys</p>
          <h1>Ota yhteyttä ja suunnitelkaamme seuraava askel</h1>
        </div>
      </section>

      <section class="section-spacing">
        <div class="container contact-layout">
          <div class="contact-card">
            <h3>Yhteystiedot</h3>
            <p><strong>Sähköposti:</strong> tommi@novaride.fi</p>
            <p><strong>Puh:</strong> +358 40 123 4567</p>
            <p><strong>Osoite:</strong> Helsinginkatu 12, Helsinki</p>
            <p><strong>Aukiolo:</strong> Ma–Pe 9:00–18:00</p>
          </div>

          <form class="contact-form">
            <label>
              Nimi
              <input type="text" name="name" placeholder="Etunimi Sukunimi" />
            </label>
            <label>
              Sähköposti
              <input type="email" name="email" placeholder="nimi@esimerkki.fi" />
            </label>
            <label>
              Viesti
              <textarea name="message" rows="5" placeholder="Kerro tarpeestasi..."></textarea>
            </label>
            <button type="submit" class="button button-primary">Lähetä viesti</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2025 Nova Ride</p>
        <p>tommi@novaride.fi</p>
      </div>
    </footer>
  </body>
</html>
